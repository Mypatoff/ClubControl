name: Build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ClubControl.sln
        working-directory: .

      - name: Run tests
        run: dotnet test src/ClubControl.Tests/ClubControl.Tests.csproj -c Release --no-restore

      - name: Run session tests (server, Windows only)
        run: dotnet test src/ClubControl.Server.Tests/ClubControl.Server.Tests.csproj -c Release --no-restore

      # Self-contained: the PCs need no separate .NET install. The client's "Update client" zip is
      # made from this same build, so an updated PC keeps working without the runtime too.
      - name: Publish server
        run: dotnet publish src/ClubControl.Server/ClubControl.Server.csproj -c Release -r win-x64 --self-contained true -o publish/server

      - name: Publish client
        run: dotnet publish src/ClubControl.Client/ClubControl.Client.csproj -c Release -r win-x64 --self-contained true -o publish/client

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer (ClubControl-Setup.exe)
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=1.0.${{ github.run_number }}" installer\ClubControl.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ClubControl-Setup
          path: dist/ClubControl-Setup.exe

      - name: Copy install scripts
        run: |
          Copy-Item scripts/install-server.ps1, scripts/install-server.bat publish/server/
          Copy-Item scripts/install-client.ps1, scripts/install-client.bat publish/client/

      - name: Upload server build
        uses: actions/upload-artifact@v4
        with:
          name: ClubControl-Server
          path: publish/server

      - name: Upload client build
        uses: actions/upload-artifact@v4
        with:
          name: ClubControl-Client
          path: publish/client

      - name: Zip builds for the release
        run: |
          Compress-Archive -Path publish/server/* -DestinationPath ClubControl-Server-win-x64.zip
          Compress-Archive -Path publish/client/* -DestinationPath ClubControl-Client-win-x64.zip

      # Keeps one rolling "latest" release with the newest .exe builds attached, so there is
      # always a stable download link in the repo instead of having to dig through Actions runs.
      - name: Publish "latest" release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from the latest commit on main (${{ github.sha }}). Not a stability guarantee - just the newest build.
          prerelease: true
          files: |
            dist/ClubControl-Setup.exe
            ClubControl-Server-win-x64.zip
            ClubControl-Client-win-x64.zip
